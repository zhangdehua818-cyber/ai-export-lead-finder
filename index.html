<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Export Lead Finder V4</title>

<style>

body{
font-family:Arial,"Microsoft YaHei";
background:#f5f7fb;
padding:30px;
}


.container{
max-width:1000px;
margin:auto;
}


.card{

background:white;
padding:30px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 10px 30px #ddd;

}


h1{
color:#2563eb;
text-align:center;
}


input,select{

width:100%;
padding:15px;
margin-top:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;

}


button{

width:100%;
padding:15px;
margin-top:20px;

background:#2563eb;
color:white;

border:none;
border-radius:10px;

font-size:18px;

cursor:pointer;

}



.section{

background:#f8fafc;
padding:20px;

border-radius:15px;

white-space:pre-line;

margin-top:15px;

}



.customer{

background:white;

border-left:5px solid #2563eb;

padding:20px;

margin-top:15px;

border-radius:10px;

}



</style>

</head>


<body>


<div class="container">


<div class="card">


<h1>
🌎 AI Export Lead Finder
</h1>


<p style="text-align:center">
AI外贸客户开发助手 V4
</p>



<input id="product"
placeholder="输入产品，例如：五金工具">


<select id="country">

<option>Germany</option>

<option>USA</option>

<option>UK</option>

<option>Canada</option>

</select>



<select id="type">

<option>进口商</option>

<option>批发商</option>

<option>经销商</option>

</select>



<button onclick="searchLead()">

开始AI分析

</button>



</div>




<div class="card">

<h2>
📊 市场分析
</h2>

<div id="market" class="section">

等待分析...

</div>


<h2>
🔎 搜索关键词
</h2>

<div id="search" class="section">

</div>


<h2>
🌍 开发渠道
</h2>

<div id="channels" class="section">

</div>



<h2>
🎯 客户开发策略
</h2>

<div id="strategy" class="section">

</div>



<h2>
✉️ AI开发信
</h2>

<div id="mail" class="section">

</div>


</div>




<div class="card">

<h2>
🏢 推荐客户
</h2>


<div id="leads">

等待搜索...

</div>


</div>



</div>



<script>


async function searchLead(){


let product=
document.getElementById("product").value;


let country=
document.getElementById("country").value;


let type=
document.getElementById("type").value;



document.getElementById("market").innerText=
"AI分析中...";



let response=await fetch(

"https://ai-export-lead-finder.onrender.com/find-leads",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

product,

country,

type

})

}

);



let data=await response.json();



document.getElementById("market").innerText=data.market;


document.getElementById("search").innerText=data.search;


document.getElementById("channels").innerText=data.channels;


document.getElementById("strategy").innerText=data.strategy;


document.getElementById("mail").innerText=data.mail;



let html="";



data.leads.forEach(item=>{


html+=`

<div class="customer">


<h3>
${item.company}
</h3>


<p>
国家：
${item.country}
</p>


<p>
类型：
${item.type}
</p>


<p>
网站：
${item.website}
</p>


<p>
邮箱：
${item.email}
</p>


<p>
匹配度：
${item.score}
</p>


</div>

`;



});


document.getElementById("leads").innerHTML=html;



}


</script>


</body>

</html>
