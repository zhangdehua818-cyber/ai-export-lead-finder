<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
AI外贸客户开发助手 V3.0
</title>


<style>

*{

box-sizing:border-box;

}



body{

margin:0;

font-family:

"Microsoft YaHei",Arial;

background:#f4f7fb;

color:#1f2937;

}



.container{

max-width:1200px;

margin:auto;

padding:30px;

}



.header{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

margin-bottom:20px;

}



h1{

color:#2563eb;

text-align:center;

}



.subtitle{

text-align:center;

color:#666;

}



.card{

background:white;

padding:25px;

border-radius:20px;

margin-bottom:20px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



input,select{

width:100%;

padding:14px;

margin:8px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

}



button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:16px;

cursor:pointer;

margin-top:10px;

}



button:hover{

opacity:.9;

}



.vip-box{

display:flex;

gap:15px;

}



.vip{

flex:1;

padding:20px;

border-radius:15px;

background:#f8fafc;

text-align:center;

}



.vip h3{

color:#2563eb;

}



.customer{

background:#f8fafc;

padding:20px;

margin-top:15px;

border-radius:15px;

border-left:5px solid #2563eb;

}



.score{

font-size:22px;

color:#2563eb;

}



.hidden{

display:none;

}



.flex{

display:flex;

gap:20px;

}



.flex > div{

flex:1;

}



.info{

background:#eff6ff;

padding:15px;

border-radius:12px;

}



.green{

background:#16a34a;

}



.red{

background:#dc2626;

}



textarea{

width:100%;

height:200px;

padding:15px;

border-radius:10px;

border:1px solid #ddd;

}



</style>

</head>


<body>


<div class="container">


<div class="header">


<h1>
🌎 AI外贸客户开发助手 V3.0
</h1>


<p class="subtitle">

AI寻找海外采购商 · 自动分析 · 自动开发

</p>


</div>



<!-- 登录注册 -->


<div class="card">


<h2>
用户中心
</h2>


<div id="loginArea">


<input

id="email"

placeholder="邮箱"

>


<input

id="password"

type="password"

placeholder="密码"

>


<div class="flex">


<div>

<button onclick="register()">

注册

</button>

</div>


<div>

<button onclick="login()">

登录

</button>

</div>


</div>


</div>




<div id="userArea" class="hidden">


<div class="info">


账号：

<span id="userEmail"></span>


<br>


会员：

<span id="userVip"></span>


<br>


Token状态：

已登录


</div>


<button onclick="logout()">

退出登录

</button>


</div>


</div>





<!-- 会员 -->


<div class="card">


<h2>

会员套餐

</h2>


<div class="vip-box">


<div class="vip">

<h3>

免费版

</h3>


<p>

每日3次搜索

</p>

</div>



<div class="vip">

<h3>

专业版

</h3>


<p>

¥99/月

</p>


<p>

100次搜索

</p>

</div>



<div class="vip">

<h3>

企业版

</h3>


<p>

¥299/月

</p>


<p>

团队使用

</p>

</div>



</div>


</div>
</div>

<script>

let token = localStorage.getItem("token") || "";

let csvData = "";

const API =
"https://ai-export-lead-finder.onrender.com";



// 页面加载检查登录

window.onload=function(){

if(token){

showUser();

}

}




// 注册

async function register(){


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



let res = await fetch(

API+"/register",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

email,

password

})

}

);



let data = await res.json();



if(data.success){

alert(

"注册成功，请登录"

);

}else{


alert(

data.message || "注册失败"

);


}


}





// 登录

async function login(){


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



let res = await fetch(

API+"/login",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

email,

password

})

}

);



let data = await res.json();



if(data.success){


token=data.token;


localStorage.setItem(

"token",

token

);



localStorage.setItem(

"user",

JSON.stringify(data.user)

);



showUser();


alert(

"登录成功"

);



}else{


alert(

data.message

);



}


}







// 显示用户

function showUser(){


let user =

JSON.parse(

localStorage.getItem("user")

);



if(!user){

return;

}



document.getElementById(

"loginArea"

).className="hidden";



document.getElementById(

"userArea"

).className="";



document.getElementById(

"userEmail"

).innerText=

user.email;



document.getElementById(

"userVip"

).innerText=

user.vip;



}







// 退出

function logout(){


localStorage.removeItem(

"token"

);


localStorage.removeItem(

"user"

);



token="";


location.reload();


}






</script>


<!-- 客户搜索区域 -->


<div class="card">


<h2>

🚀 AI寻找海外客户

</h2>


<input

id="product"

placeholder="输入产品，例如：CNC加工件"

>


<select id="country">


<option>

Germany

</option>


<option>

USA

</option>


<option>

UK

</option>


<option>

France

</option>


<option>

Canada

</option>


</select>



<button onclick="findLeads()">

开始寻找客户

</button>


</div>





<div class="card">


<h2>

📊 产品分析

</h2>


<div id="analysis">

等待分析...

</div>


</div>






<div class="card">


<h2>

🏢 海外客户列表

</h2>


<button class="green" onclick="downloadCSV()">

导出客户名单

</button>


<div id="customers">

暂无客户

</div>


</div>






<div class="card">


<h2>

✉️ AI开发信

</h2>


<textarea id="emailText">

等待生成

</textarea>


</div>





<script>




// 搜索客户

async function findLeads(){



if(!token){


alert(

"请先登录"

);


return;

}



let product=

document.getElementById(

"product"

).value;



let country=

document.getElementById(

"country"

).value;




let res = await fetch(

API+"/find-leads",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

token,

product,

country

})


}

);



let data = await res.json();



if(data.message){


alert(data.message);


return;

}





csvData=data.excel;




document.getElementById(

"analysis"

).innerText=

JSON.stringify(

data.analysis,

null,

2

);





let html="";



data.customers.forEach(c=>{


html +=

`

<div class="customer">


<h3>

${c.company}

</h3>


<p>

国家：

${c.country}

</p>


<p>

类型：

${c.type}

</p>


<p class="score">

评分：

${c.score}

</p>


<p>

官网：

${c.website}

</p>


<p>

邮箱：

${c.email}

</p>


<p>

联系人：

${c.contactPerson}

</p>


<p>

状态：

${c.status}

</p>


</div>


`;



});



document.getElementById(

"customers"

).innerHTML=

html;




if(data.customers.length){


document.getElementById(

"emailText"

).value=

data.customers[0].emailTemplate;


}



}






// 导出CSV

function downloadCSV(){



if(!csvData){


alert(

"没有数据"

);


return;

}



let blob = new Blob(

[csvData],

{

type:

"text/csv;charset=utf-8"

}

);



let url=

URL.createObjectURL(blob);



let a=

document.createElement("a");



a.href=url;


a.download=

"海外客户名单.csv";


a.click();



}



</script>


</body>

</html>
