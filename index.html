<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
AI外贸客户开发助手 Ultimate V1.0
</title>


<style>

body{

font-family:

"Microsoft YaHei",Arial;

background:#f5f7fb;

padding:30px;

}



.container{

max-width:1100px;

margin:auto;

}



.card{

background:white;

padding:25px;

border-radius:20px;

margin-bottom:20px;

box-shadow:0 5px 20px #ddd;

}



h1{

text-align:center;

color:#2563eb;

}



input,select{

width:100%;

padding:14px;

margin:8px 0;

border-radius:10px;

border:1px solid #ddd;

font-size:16px;

}



button{

width:100%;

padding:15px;

background:#2563eb;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

}



.box{

background:#f8fafc;

padding:20px;

border-radius:15px;

white-space:pre-line;

}



.customer{

background:#fff;

border-left:5px solid #2563eb;

padding:20px;

margin-top:15px;

border-radius:12px;

}



.score{

font-size:22px;

color:#2563eb;

}



.download{

background:#16a34a;

margin-top:15px;

}



</style>


</head>



<body>


<div class="container">



<div class="card">


<h1>

🌎 AI外贸客户开发助手

<br>

Ultimate V1.0

</h1>


<p style="text-align:center">

AI寻找海外采购商 · 自动开发客户

</p>



<input

id="product"

placeholder="输入产品，例如：CNC加工件"

>



<select id="country">


<option>Germany</option>

<option>USA</option>

<option>UK</option>

<option>France</option>

<option>Canada</option>


</select>



<select id="type">


<option>Importer</option>

<option>Distributor</option>

<option>Wholesaler</option>


</select>



<button onclick="searchLead()">

🚀 开始寻找客户

</button>



</div>





<div class="card">


<h2>
📊 AI产品分析
</h2>


<div id="analysis" class="box">

等待分析...

</div>



</div>





<div class="card">


<h2>
🏢 海外客户列表
</h2>


<button class="download" onclick="downloadCSV()">

📥 导出客户名单

</button>


<div id="customers">

等待搜索...

</div>


</div>





<div class="card">


<h2>
✉️ AI开发信
</h2>


<div id="email" class="box">

等待生成...

</div>


</div>



</div>






<script>


let csvData="";



async function searchLead(){



const product =

document.getElementById("product").value;



const country =

document.getElementById("country").value;



const type =

document.getElementById("type").value;




const res = await fetch(


"https://ai-export-lead-finder.onrender.com/find-leads",


{


method:"POST",


headers:{


"Content-Type":

"application/json"


},


body:JSON.stringify({


product,

country,

type


})


}


);



const data = await res.json();




document.getElementById("analysis").innerText =

JSON.stringify(

data.analysis,

null,

2

);




csvData = data.excel;




let html="";



data.customers.forEach(c=>{



html += `


<div class="customer">


<h3>

${c.company}

</h3>


<p>

🌍 国家：

${c.country}

</p>



<p>

类型：

${c.type}

</p>



<p class="score">

评分：

${c.score}

</p>



<p>

官网：

${c.website}

</p>



<p>

邮箱：

${c.email}

</p>



<p>

联系人：

${c.contactPerson}

</p>



<p>

状态：

${c.status}

</p>



<p>

原因：

${c.reason}

</p>



</div>


`;



});




document.getElementById("customers").innerHTML = html;




if(data.customers.length>0){


document.getElementById("email").innerText =

data.customers[0].emailTemplate;


}



}





function downloadCSV(){



if(!csvData){


alert(

"请先搜索客户"

);


return;


}



const blob = new Blob(

[csvData],

{

type:

"text/csv;charset=utf-8"

}

);



const url = URL.createObjectURL(blob);



const a=document.createElement("a");


a.href=url;


a.download=

"海外客户名单.csv";


a.click();



}



</script>



</body>

</html>
