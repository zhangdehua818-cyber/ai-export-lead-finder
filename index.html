<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI外贸客户开发助手 V8 商业版</title>


<style>

body{
font-family:"Microsoft YaHei",Arial;
background:#f4f7fb;
padding:30px;
}


.container{
max-width:1100px;
margin:auto;
}


.card{

background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 20px #ddd;

}


h1{

text-align:center;
color:#2563eb;

}


input,select{

width:100%;
padding:14px;
margin:8px 0;

border-radius:10px;
border:1px solid #ddd;

font-size:16px;

}


button{

padding:14px;
width:100%;
background:#2563eb;
color:white;
border:0;
border-radius:10px;
font-size:17px;
cursor:pointer;

}


.box{

background:#f8fafc;
padding:20px;
border-radius:15px;
white-space:pre-line;

}


.customer{

border-left:5px solid #2563eb;

background:#fff;

padding:20px;

margin-top:15px;

border-radius:12px;

}



.tag{

display:inline-block;

padding:5px 10px;

background:#e0edff;

border-radius:8px;

}



</style>


</head>



<body>



<div class="container">



<div class="card">


<h1>
🌎 AI外贸客户开发助手 V8 商业版
</h1>


<p style="text-align:center">
AI寻找海外采购商 · 自动开发客户
</p>



<input id="product"
placeholder="输入产品，例如：五金工具">


<select id="country">

<option>Germany</option>

<option>USA</option>

<option>UK</option>

<option>France</option>

</select>



<select id="type">

<option>Importer</option>

<option>Distributor</option>

<option>Wholesaler</option>

</select>



<button onclick="searchLead()">

🚀 开始寻找客户

</button>


</div>





<div class="card">

<h2>
📊 产品分析
</h2>

<div id="analysis" class="box">
等待分析...
</div>



<h2>
🔎 搜索关键词
</h2>

<div id="keywords" class="box"></div>


<h2>
🌍 开发渠道
</h2>

<div id="channels" class="box"></div>


<h2>
🎯 客户筛选策略
</h2>

<div id="strategy" class="box"></div>


</div>





<div class="card">


<h2>
🏢 潜在客户列表
</h2>


<button onclick="downloadExcel()">

📥 导出客户名单

</button>


<div id="customers">

等待搜索...

</div>



</div>





<div class="card">

<h2>
✉️ AI开发信
</h2>

<div id="email" class="box">

等待生成...

</div>


</div>





</div>






<script>



let excelData="";



async function searchLead(){



let product =
document.getElementById("product").value;


let country =
document.getElementById("country").value;


let type =
document.getElementById("type").value;



let res =
await fetch(

"https://ai-export-lead-finder.onrender.com/find-leads",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

product,

country,

type

})

}

);



let data =
await res.json();




document.getElementById("analysis").innerText =

JSON.stringify(
data.productInfo,
null,
2
);



document.getElementById("keywords").innerText =

data.productInfo.keywords.join("\n");



document.getElementById("channels").innerText =

"Google\nLinkedIn\nB2B目录\n行业网站";



document.getElementById("strategy").innerText =

"筛选标准：\n✓ 产品匹配\n✓ 有采购能力\n✓ 有渠道价值";




document.getElementById("email").innerText =

data.customers[0]?.emailTemplate || "";




excelData =
data.excel;




let html="";



data.customers.forEach(c=>{


html += `


<div class="customer">


<h3>

${c.company}

</h3>



<p>

国家：
${c.country}

</p>


<p>

类型：

<span class="tag">
${c.type}
</span>

</p>



<p>

评分：

${c.score}

</p>



<p>

官网：

${c.website}

</p>



<p>

邮箱：

${c.email}

</p>



<p>

原因：

${c.reason}

</p>


<p>

状态：

${c.status}

</p>



</div>


`;



});



document.getElementById("customers").innerHTML = html;



}





function downloadExcel(){



if(!excelData){

alert("请先搜索客户");

return;

}



let blob =
new Blob(

[excelData],

{
type:"text/csv;charset=utf-8;"
}

);



let url =
URL.createObjectURL(blob);



let a =
document.createElement("a");


a.href=url;

a.download="AI外贸客户名单.csv";


a.click();



}



</script>



</body>

</html>
