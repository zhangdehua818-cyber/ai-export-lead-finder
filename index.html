<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI外贸客户开发助手 V5.2</title>

<style>

body{
font-family:Arial,"Microsoft YaHei";
background:#f5f7fb;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 8px 25px #ddd;
}

h1{
color:#2563eb;
text-align:center;
}

input,select{
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#2563eb;
color:white;
border:0;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.box{
background:#f8fafc;
padding:20px;
border-radius:15px;
white-space:pre-line;
margin-top:10px;
}

.customer{
padding:20px;
background:white;
border-left:5px solid #2563eb;
margin-top:15px;
border-radius:10px;
}

</style>

</head>


<body>


<div class="container">


<div class="card">

<h1>
🌎 AI外贸客户开发助手 V5.2
</h1>

<p style="text-align:center">
AI寻找海外采购商
</p>


<input id="product" placeholder="输入产品，例如：CNC加工件">


<select id="country">

<option>Germany</option>
<option>USA</option>
<option>UK</option>
<option>Canada</option>

</select>


<select id="type">

<option>进口商</option>
<option>经销商</option>
<option>批发商</option>

</select>


<button onclick="searchLead()">

开始寻找客户

</button>


</div>



<div class="card">

<h2>📊 市场分析</h2>

<div id="market" class="box">
等待分析...
</div>


<h2>🔎 搜索关键词</h2>

<div id="keywords" class="box">
</div>


<h2>🌍 开发渠道</h2>

<div id="channels" class="box">
</div>


<h2>🎯 客户策略</h2>

<div id="strategy" class="box">
</div>


<h2>✉️ AI开发信</h2>

<div id="mail" class="box">
</div>


</div>




<div class="card">

<h2>🏢 潜在客户</h2>


<div id="leads">

等待搜索...

</div>


</div>



</div>



<script>


async function searchLead(){


let product =
document.getElementById("product").value;


let country =
document.getElementById("country").value;


let type =
document.getElementById("type").value;



let res = await fetch(

"https://ai-export-lead-finder.onrender.com/find-leads",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

product,

country,

type

})

}

);



let data = await res.json();



document.getElementById("market").innerText=data.market;


document.getElementById("keywords").innerText=
data.keywords.join("\n");


document.getElementById("channels").innerText=
data.channels;


document.getElementById("strategy").innerText=
data.strategy;


document.getElementById("mail").innerText=
data.mail;



let html="";



data.leads.forEach(item=>{


html+=`

<div class="customer">

<h3>${item.company}</h3>

<p>
国家：
${item.country}
</p>


<p>
类型：
${item.type}
</p>


<p>
官网：
${item.website}
</p>


<p>
邮箱：
${item.email}
</p>


<p>
匹配度：
${item.score}
</p>


<p>
原因：
${item.reason || ""}
</p>


</div>

`;



});



document.getElementById("leads").innerHTML=html;



}


</script>


</body>

</html>
