<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI外贸客户开发助手 V3.3</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
  background:#f5f7fb;
  color:#1f2937;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

.header{
  background:white;
  border-radius:16px;
  padding:24px 28px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.header h1{
  margin:0 0 8px;
  font-size:28px;
}

.header p{
  margin:0;
  color:#6b7280;
}

.version{
  display:inline-block;
  margin-left:8px;
  padding:4px 9px;
  background:#eef2ff;
  color:#4f46e5;
  border-radius:8px;
  font-size:13px;
}

.card{
  background:white;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.card h2{
  margin-top:0;
  font-size:20px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

label{
  display:block;
  font-weight:600;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#6366f1;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.primary{
  background:#4f46e5;
  color:white;
}

.primary:hover{
  background:#4338ca;
}

.secondary{
  background:#eef2ff;
  color:#4338ca;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.status{
  margin-top:15px;
  padding:12px 14px;
  border-radius:10px;
  background:#f3f4f6;
  color:#4b5563;
  display:none;
}

.status.show{
  display:block;
}

.user-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.user-info{
  font-size:14px;
}

.vip{
  display:inline-block;
  padding:4px 9px;
  border-radius:8px;
  background:#fef3c7;
  color:#92400e;
  font-weight:600;
  margin-left:6px;
}

.hidden{
  display:none!important;
}

.loading{
  padding:25px;
  text-align:center;
  color:#6b7280;
}

.result-count{
  font-size:14px;
  color:#6b7280;
  margin-bottom:15px;
}

.customer{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
}

.customer-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.customer h3{
  margin:0 0 7px;
  font-size:18px;
}

.score{
  min-width:65px;
  text-align:center;
  padding:6px 9px;
  border-radius:8px;
  background:#ecfdf5;
  color:#047857;
  font-weight:700;
}

.meta{
  font-size:14px;
  color:#6b7280;
  line-height:1.7;
}

.website{
  margin-top:8px;
}

.website a{
  color:#4f46e5;
  text-decoration:none;
  word-break:break-all;
}

.email{
  margin-top:8px;
  font-weight:600;
}

.email.empty{
  color:#9ca3af;
  font-weight:normal;
}

.email-text{
  margin-top:12px;
  padding:12px;
  background:#f9fafb;
  border-radius:9px;
  white-space:pre-wrap;
  line-height:1.6;
  font-size:14px;
}

.empty{
  text-align:center;
  color:#9ca3af;
  padding:30px;
}

@media(max-width:700px){

  .form-row{
    grid-template-columns:1fr;
  }

  .container{
    padding:15px;
  }

  .header{
    padding:20px;
  }

  .card{
    padding:18px;
  }

  .customer-top{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- =========================
       Header
  ========================== -->

  <div class="header">

    <h1>
      AI外贸客户开发助手
      <span class="version">V3.3</span>
    </h1>

    <p>
      Tavily 海外搜索 · 潜在买家筛选 · 公司评分 · 客户开发
    </p>

  </div>


  <!-- =========================
       登录注册
  ========================== -->

  <div class="card" id="authCard">

    <h2>账号登录</h2>

    <div class="form-row">

      <div>
        <label>邮箱</label>

        <input
          id="email"
          type="email"
          placeholder="请输入邮箱"
        >
      </div>

      <div>
        <label>密码</label>

        <input
          id="password"
          type="password"
          placeholder="请输入密码"
        >
      </div>

    </div>

    <div class="actions">

      <button
        class="primary"
        onclick="login()"
      >
        登录
      </button>

      <button
        class="secondary"
        onclick="register()"
      >
        注册账号
      </button>

    </div>

    <div
      id="authStatus"
      class="status"
    ></div>

  </div>


  <!-- =========================
       用户状态
  ========================== -->

  <div
    class="card hidden"
    id="userCard"
  >

    <div class="user-box">

      <div class="user-info">

        当前账号：
        <strong id="userEmail"></strong>

        <span
          class="vip"
          id="userVip"
        ></span>

      </div>

      <button
        class="danger"
        onclick="logout()"
      >
        退出登录
      </button>

    </div>

  </div>


  <!-- =========================
       客户搜索
  ========================== -->

  <div
    class="card hidden"
    id="searchCard"
  >

    <h2>开发海外客户</h2>

    <div class="form-row">

      <div>

        <label>产品</label>

        <input
          id="product"
          type="text"
          placeholder="例如：手机壳、LED灯、汽车配件"
        >

      </div>

      <div>

        <label>目标国家</label>

        <input
          id="country"
          type="text"
          placeholder="例如：美国、德国、英国"
        >

      </div>

    </div>

    <div class="actions">

      <button
        class="primary"
        onclick="findLeads()"
        id="searchButton"
      >
        开始开发客户
      </button>

    </div>

    <div
      id="searchStatus"
      class="status"
    ></div>

  </div>


  <!-- =========================
       搜索结果
  ========================== -->

  <div
    class="card hidden"
    id="resultCard"
  >

    <h2>客户开发结果</h2>

    <div
      id="resultCount"
      class="result-count"
    ></div>

    <div
      id="results"
    ></div>

  </div>

</div>


<script>

/* =========================
   API
========================= */

const API =
  "https://ai-export-lead-finder.onrender.com";


/* =========================
   本地状态
========================= */

let token =
  localStorage.getItem("ai_export_token") || "";

let currentUser =
  JSON.parse(
    localStorage.getItem("ai_export_user") || "null"
  );


/* =========================
   页面初始化
========================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    if(token && currentUser){

      showLoggedIn();

    }else{

      showLoggedOut();

    }

  }
);


/* =========================
   状态提示
========================= */

function showStatus(
  elementId,
  message,
  show=true
){

  const element =
    document.getElementById(elementId);

  if(!element) return;

  element.innerText =
    message || "";

  if(show){

    element.classList.add("show");

  }else{

    element.classList.remove("show");

  }

}


/* =========================
   注册
========================= */

async function register(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    showStatus(
      "authStatus",
      "请输入邮箱和密码"
    );

    return;
  }

  showStatus(
    "authStatus",
    "正在注册..."
  );

  try{

    const response =
      await fetch(
        `${API}/register`,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            email,
            password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "注册失败"
      );

    }

    saveLogin(
      data.token,
      data.user
    );

    showStatus(
      "authStatus",
      "注册成功"
    );

    showLoggedIn();

  }catch(error){

    showStatus(
      "authStatus",
      error.message || "注册失败"
    );

  }

}


/* =========================
   登录
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    showStatus(
      "authStatus",
      "请输入邮箱和密码"
    );

    return;
  }

  showStatus(
    "authStatus",
    "正在登录..."
  );

  try{

    const response =
      await fetch(
        `${API}/login`,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            email,
            password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "登录失败"
      );

    }

    saveLogin(
      data.token,
      data.user
    );

    showStatus(
      "authStatus",
      "登录成功"
    );

    showLoggedIn();

  }catch(error){

    showStatus(
      "authStatus",
      error.message || "登录失败"
    );

  }

}


/* =========================
   保存登录状态
========================= */

function saveLogin(
  newToken,
  user
){

  token =
    newToken || "";

  currentUser =
    user || null;

  localStorage.setItem(
    "ai_export_token",
    token
  );

  localStorage.setItem(
    "ai_export_user",
    JSON.stringify(currentUser)
  );

}


/* =========================
   登录后页面
========================= */

function showLoggedIn(){

  document
    .getElementById("authCard")
    .classList.add("hidden");

  document
    .getElementById("userCard")
    .classList.remove("hidden");

  document
    .getElementById("searchCard")
    .classList.remove("hidden");

  document
    .getElementById("userEmail")
    .innerText =
      currentUser?.email || "";

  document
    .getElementById("userVip")
    .innerText =
      currentUser?.vip === "pro"
        ? "PRO会员"
        : "免费用户";

}


/* =========================
   未登录页面
========================= */

function showLoggedOut(){

  document
    .getElementById("authCard")
    .classList.remove("hidden");

  document
    .getElementById("userCard")
    .classList.add("hidden");

  document
    .getElementById("searchCard")
    .classList.add("hidden");

}


/* =========================
   退出登录
========================= */

function logout(){

  token = "";

  currentUser = null;

  localStorage.removeItem(
    "ai_export_token"
  );

  localStorage.removeItem(
    "ai_export_user"
  );

  document
    .getElementById("resultCard")
    .classList.add("hidden");

  showLoggedOut();

}


/* =========================
   开始开发客户
========================= */

async function findLeads(){

  const product =
    document
      .getElementById("product")
      .value
      .trim();

  const country =
    document
      .getElementById("country")
      .value
      .trim();

  if(!product){

    showStatus(
      "searchStatus",
      "请输入产品"
    );

    return;

  }

  if(!country){

    showStatus(
      "searchStatus",
      "请输入目标国家"
    );

    return;

  }

  if(!token){

    showStatus(
      "searchStatus",
      "登录状态已失效，请重新登录"
    );

    showLoggedOut();

    return;

  }


  const button =
    document.getElementById(
      "searchButton"
    );

  button.disabled = true;

  button.innerText =
    "正在寻找海外客户...";

  showStatus(
    "searchStatus",
    "正在搜索真实海外公司，请稍候..."
  );

  document
    .getElementById("resultCard")
    .classList.remove("hidden");

  document
    .getElementById("results")
    .innerHTML =
      `<div class="loading">
        正在通过 Tavily 搜索海外买家...
      </div>`;

  try{

    const response =
      await fetch(
        `${API}/find-leads`,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "Authorization":
              `Bearer ${token}`
          },

          body:JSON.stringify({
            product,
            country
          })
        }
      );

    const data =
      await response.json();

    if(response.status === 401){

      logout();

      throw new Error(
        "登录已失效，请重新登录"
      );

    }

    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "客户搜索失败"
      );

    }


    /* =========================
       更新用户数据
    ========================= */

    if(data.user){

      currentUser =
        data.user;

      localStorage.setItem(
        "ai_export_user",
        JSON.stringify(currentUser)
      );

    }


    /* =========================
       显示结果
    ========================= */

    renderResults(
      data.customers || []
    );

    showStatus(
      "searchStatus",
      `搜索完成，共找到 ${data.count || 0} 个潜在客户`
    );

  }catch(error){

    document
      .getElementById("results")
      .innerHTML =
        `<div class="empty">
          ${escapeHtml(
            error.message ||
            "搜索失败"
          )}
        </div>`;

    showStatus(
      "searchStatus",
      error.message ||
      "客户搜索失败"
    );

  }finally{

    button.disabled = false;

    button.innerText =
      "开始开发客户";

  }

}


/* =========================
   渲染客户
========================= */

function renderResults(customers){

  const container =
    document.getElementById(
      "results"
    );

  const count =
    document.getElementById(
      "resultCount"
    );

  count.innerText =
    `共找到 ${customers.length} 个潜在客户`;

  if(!customers.length){

    container.innerHTML =
      `<div class="empty">
        暂时没有找到符合条件的客户。
        <br>
        可以尝试更换产品关键词或目标国家。
      </div>`;

    return;

  }

  container.innerHTML =
    customers
      .map(
        (customer,index) => {

          const website =
            customer.website || "";

          const email =
            customer.email || "";

          const emailText =
            customer.emailText || "";

          return `

            <div class="customer">

              <div class="customer-top">

                <div>

                  <h3>
                    ${escapeHtml(
                      customer.company ||
                      `潜在客户 ${index + 1}`
                    )}
                  </h3>

                  <div class="meta">

                    国家：
                    ${escapeHtml(
                      customer.country || ""
                    )}

                    <br>

                    类型：
                    ${escapeHtml(
                      customer.type ||
                      "Potential Buyer"
                    )}

                    <br>

                    来源：
                    ${escapeHtml(
                      customer.source ||
                      "Tavily"
                    )}

                  </div>

                </div>

                <div class="score">

                  ${Number(
                    customer.score || 0
                  )}分

                </div>

              </div>


              <div class="website">

                网站：

                ${
                  website
                    ? `<a
                        href="${escapeAttribute(website)}"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        ${escapeHtml(website)}
                      </a>`
                    : "未找到"
                }

              </div>


              <div class="email ${
                email
                  ? ""
                  : "empty"
              }">

                邮箱：

                ${
                  email
                    ? escapeHtml(email)
                    : "暂未找到公开邮箱"
                }

              </div>


              ${
                customer.description
                  ? `
                    <div class="meta"
                         style="margin-top:10px">

                      ${escapeHtml(
                        customer.description
                      )}

                    </div>
                  `
                  : ""
              }


              ${
                emailText
                  ? `
                    <div class="email-text">

                      ${escapeHtml(
                        emailText
                      )}

                    </div>
                  `
                  : ""
              }

            </div>

          `;

        }
      )
      .join("");

}


/* =========================
   HTML安全处理
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttribute(value){

  return String(value || "")
    .replace(/"/g,"%22")
    .replace(/</g,"%3C")
    .replace(/>/g,"%3E");

}

</script>

</body>
</html>
