<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI外贸客户开发助手 V6</title>


<style>

body{
font-family:Arial,"Microsoft YaHei";
background:#f5f7fb;
padding:30px;
}


.container{
max-width:1000px;
margin:auto;
}


.card{

background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 8px 25px #ddd;

}


h1{

color:#2563eb;
text-align:center;

}


input,select{

width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;

}



button{

width:100%;
padding:15px;

margin-top:15px;

background:#2563eb;

color:white;

border:0;

border-radius:10px;

font-size:18px;

}



.box{

background:#f8fafc;

padding:20px;

border-radius:15px;

white-space:pre-line;

margin-top:10px;

}



.customer{

background:white;

border-left:5px solid #2563eb;

padding:20px;

margin-top:15px;

border-radius:10px;

}



</style>


</head>



<body>



<div class="container">



<div class="card">


<h1>
🌎 AI外贸客户开发助手 V6
</h1>


<p style="text-align:center">
AI寻找海外采购商
</p>



<input id="product"
placeholder="例如：CNC加工件">


<select id="country">

<option>Germany</option>

<option>USA</option>

<option>UK</option>

<option>Canada</option>

</select>



<select id="type">

<option>Importer</option>

<option>Distributor</option>

<option>Wholesaler</option>

</select>



<button onclick="searchLead()">

开始寻找客户

</button>


</div>




<div class="card">


<h2>📊 产品分析</h2>

<div id="analysis" class="box">
等待分析...
</div>



<h2>🔎 搜索关键词</h2>

<div id="keywords" class="box"></div>



<h2>🌍 开发渠道</h2>

<div id="channels" class="box"></div>



<h2>🎯 筛选策略</h2>

<div id="strategy" class="box"></div>



<h2>✉️ AI开发信</h2>

<div id="email" class="box"></div>


</div>





<div class="card">


<h2>
🏢 潜在客户
</h2>


<div id="customers">

等待搜索...

</div>


</div>



</div>






<script>


async function searchLead(){


const product =
document.getElementById("product").value;


const country =
document.getElementById("country").value;


const type =
document.getElementById("type").value;



const response =
await fetch(

"https://ai-export-lead-finder.onrender.com/find-leads",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

product,

country,

type

})

}

);



const data =
await response.json();



document.getElementById("analysis").innerText =
data.analysis;



document.getElementById("keywords").innerText =
data.keywords.join("\n");



document.getElementById("channels").innerText =
data.channels;



document.getElementById("strategy").innerText =
data.strategy;



document.getElementById("email").innerText =
data.email;




let html="";



data.customers.forEach(c=>{


html += `

<div class="customer">


<h3>${c.company}</h3>


<p>
国家：
${c.country}
</p>


<p>
类型：
${c.type}
</p>


<p>
官网：
${c.website}
</p>


<p>
邮箱：
${c.email}
</p>


<p>
评分：
${c.score}
</p>


<p>
原因：
${c.reason}
</p>



</div>

`;



});



document.getElementById("customers").innerHTML =
html;



}


</script>



</body>

</html>
